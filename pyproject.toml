[project]
name = "fin_discrim"
version = "0.1.0"
description = "Financial research discriminator"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "anthropic>=0.125.0",
    "click>=8.4.2",
    "numpy>=2.5.1",
]

[project.scripts]
fin-discrim = "fin_discrim.cli:main"
fin-discrim-item = "fin_discrim.build_item:main"
fin-pointwise = "fin_discrim.pointwise.cli:main"

[dependency-groups]
dev = [
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

[build-system]
requires = ["uv_build>=0.11.31,<0.12"]
build-backend = "uv_build"

[tool.pyright]
venvPath = "."
venv = ".venv"
